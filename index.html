<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constraint validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="form-container">
        
         <form id="myForm" novalidate>
             <h1>FILL IN THE FORM</h1>

            <label for="email"> *Email: </label>
            <input type="email" id="email" name="user-email" required>
             <span class="error" id="email-error"></span>

             <br>

            <label for="country"> *Country: </label>
            <input type="text" id="country" name="user-country"required>
            <span class="error" id="country-error"></span>

            <br>

            <label for="postal"> *Postal code: </label>
            <input type="text" id="postal" name="zip-code" required>
            <span class="error" id="postal-error"></span>

            <br>

            <label for="password"> *Password: </label>
            <input type="password" id="password" name="user-password" required>
            <span class="error" id="password-error"></span>

            <br>

            <label for="confirm"> *Confirm password: </label>
            <input type="password" id="confirm" name="user-password" required>
            <span class="error" id="password-error"></span>

            <br>

            <button type="submit">submit</button>

         </form>

         <div id="success"></div>

    </div>
    <script src="script.js"></script>

</body>
</html>
